<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="description" content="A fillable IB DP Biology HL viruses workbook. Read, write, draw and export your answers, one screen at a time."><title>Viruses · Biology workbook</title><link rel="icon" href="../rate-expressions/favicon.svg"><link rel="stylesheet" href="styles.css"><script defer src="../rate-expressions/vendor/katex.min.js"></script><script defer src="../rate-expressions/vendor/mhchem.min.js"></script><script type="module" src="app.js?v=20260918-sim2"></script></head>
<body><div id="app">
<header class="topbar"><a class="brand" href="../../">Biology workbook</a><span class="workbook-name">Viruses</span><nav aria-label="Workbook tools"><button id="contents-button">Contents</button><button id="student-button">Student</button><button id="export-button">Export <span aria-hidden="true">↗</span></button></nav></header>
<div class="progress-row"><progress id="progress" aria-label="Responses started" value="0" max="1"></progress><span id="progress-label"></span></div>
<main id="main"><div class="title-row"><h1 id="page-title"></h1><span id="page-counter"></span></div><div id="view-tabs" role="tablist" aria-label="Screen view"><button role="tab" id="read-tab" aria-controls="reader" aria-selected="true">Read</button><button role="tab" id="answer-tab" aria-controls="answer-panel" aria-selected="false">Answer</button></div>
<div id="workspace"><section id="reader" aria-label="Reading"><div id="reading-body"></div><div class="reading-nav"><button id="reading-prev" aria-label="Previous reading page">←</button><span id="reading-count"></span><button id="reading-next" aria-label="Next reading page">→</button></div></section><section id="answer-panel" aria-label="Your response"><div class="question-header"><h2 id="question"></h2><p id="question-meta"></p></div><div id="editor"></div></section></div></main>
<footer class="bottombar"><button id="back-button">← Back</button><span id="location-label"></span><span id="save-status" role="status">Saved on this device</span><button id="next-button" class="primary">Next →</button></footer>
</div><dialog id="dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="close-dialog" aria-label="Close dialog">×</button></div><div id="dialog-body"></div></dialog><input id="backup-file" type="file" accept=".json,application/json" hidden><div id="toast" role="status"></div><noscript>This workbook needs JavaScript for editing and saving answers.</noscript></body></html>
